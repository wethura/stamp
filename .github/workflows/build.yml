name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          status=0
          python -m unittest discover -s tests -v 2>&1 | tee unittest.log || status=1
          if [ "$status" -ne 0 ]; then
            grep -E "^(FAIL|ERROR):" unittest.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

  build-windows:
    name: build windows exe
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Determine version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
      - name: Build with PyInstaller
        run: pyinstaller -y StampTool-win.spec
      - name: Smoke-check exe (selftest)
        shell: pwsh
        run: |
          if (-Not (Test-Path "dist/StampTool.exe")) { throw "StampTool.exe not produced" }
          "{0:N0} bytes" -f (Get-Item "dist/StampTool.exe").Length
          # 自检：窗口真正映射才通过（导入链/资源缺失都会失败）
          $env:STAMPTOOL_SELFTEST = "full"
          $proc = Start-Process -FilePath "dist\StampTool.exe" -PassThru
          if (-not $proc.WaitForExit(90000)) { $proc.Kill(); throw "selftest timed out" }
          if ($proc.ExitCode -ne 0) { throw "selftest failed (exit $($proc.ExitCode))" }
          "selftest passed: window mapped"
      - name: Package zip
        shell: pwsh
        run: |
          # Windows 分发习惯：单文件 exe 打包成 zip
          $zip = "dist\StampTool-$env:VERSION-windows-x64.zip"
          Compress-Archive -Path "dist\StampTool.exe" -DestinationPath $zip -Force
          "packaged: $zip"
      - uses: actions/upload-artifact@v4
        with:
          name: StampTool-windows-x64
          path: dist/StampTool-*-windows-x64.zip
          if-no-files-found: error

  build-macos:
    name: build macos app
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Determine version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
      - name: Build with PyInstaller
        run: pyinstaller -y StampTool.spec
      - name: Smoke-check app bundle (selftest)
        run: |
          BIN=dist/StampTool.app/Contents/MacOS/StampTool
          test -x "$BIN" || { echo "::error::app bundle not produced"; exit 1; }
          # 自检：窗口布局就绪 + 核心链路（渲染/盖章/导出）
          # 不用 timeout(1)：macOS runner 无 GNU coreutils
          STAMPTOOL_SELFTEST=full "$BIN" > selftest.log 2>&1 &
          PID=$!
          for _ in $(seq 1 120); do
            kill -0 "$PID" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$PID" 2>/dev/null; then
            kill -9 "$PID" 2>/dev/null
            echo "::error::selftest timed out after 120s"
            cat selftest.log
            exit 1
          fi
          wait "$PID"; CODE=$?
          cat selftest.log
          if [ "$CODE" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::selftest(exit=$CODE): $line"
            done < selftest.log
            exit 1
          fi
          ls -la dist/
      - name: Package dmg and zip
        run: |
          ARCH=$(uname -m)
          # macOS 分发习惯：dmg + Applications 快捷方式，拖拽安装
          STAGE=$(mktemp -d)
          cp -R dist/StampTool.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "StampTool $VERSION" -srcfolder "$STAGE" \
            -ov -format UDZO "dist/StampTool-${VERSION}-macos-${ARCH}.dmg"
          rm -rf "$STAGE"
          # 备用 zip（保权限位）
          ( cd dist && zip -qry "StampTool-${VERSION}-macos-${ARCH}.zip" StampTool.app )
          ls -la dist/*.dmg dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StampTool-macos
          path: |
            dist/StampTool-*-macos-*.dmg
            dist/StampTool-*-macos-*.zip
          if-no-files-found: error

  release:
    name: release (tag only)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List release assets
        run: ls -la artifacts/
      - name: Compose release body
        run: |
          {
            echo "# StampTool ${GITHUB_REF_NAME}"
            echo
            cat .github/release-notes.md
          } > release-body.md
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: release-body.md

