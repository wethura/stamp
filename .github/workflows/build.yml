name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          status=0
          python -m unittest discover -s tests -v 2>&1 | tee unittest.log || status=1
          if [ "$status" -ne 0 ]; then
            grep -E "^(FAIL|ERROR):" unittest.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

  build-windows:
    name: build windows exe
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build with PyInstaller
        run: pyinstaller -y StampTool-win.spec
      - name: Smoke-check exe
        shell: pwsh
        run: |
          if (-Not (Test-Path "dist/StampTool.exe")) { throw "StampTool.exe not produced" }
          "{0:N0} bytes" -f (Get-Item "dist/StampTool.exe").Length
      - uses: actions/upload-artifact@v4
        with:
          name: StampTool-windows-x64
          path: dist/StampTool.exe
          if-no-files-found: error

  build-macos:
    name: build macos binary
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build with PyInstaller
        run: pyinstaller -y StampTool.spec
      - name: Smoke-check binary and package zip
        run: |
          test -f dist/StampTool || { echo "dist/StampTool not produced"; exit 1; }
          ls -la dist/
          cd dist && zip -q StampTool-macos.zip StampTool
      - uses: actions/upload-artifact@v4
        with:
          name: StampTool-macos
          path: dist/StampTool-macos.zip
          if-no-files-found: error

  release:
    name: release (tag only)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
