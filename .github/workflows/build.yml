name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          status=0
          python -m unittest discover -s tests -v 2>&1 | tee unittest.log || status=1
          if [ "$status" -ne 0 ]; then
            grep -E "^(FAIL|ERROR):" unittest.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      - name: Full selftest (source mode)
        timeout-minutes: 10
        shell: bash
        run: |
          STAMPTOOL_SELFTEST=full python main.py 2>&1 | tee selftest.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            tail -25 selftest.log | while IFS= read -r line; do
              echo "::error::src-selftest: $line"
            done
            exit 1
          fi

  build-windows:
    name: build windows exe
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Determine version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
      - name: Build with PyInstaller
        run: pyinstaller -y StampTool-win.spec
      - name: Smoke-check exe (selftest)
        timeout-minutes: 10
        shell: pwsh
        run: |
          if (-Not (Test-Path "dist/StampTool.exe")) { throw "StampTool.exe not produced" }
          "{0:N0} bytes" -f (Get-Item "dist/StampTool.exe").Length
          # 自检：窗口布局 + 核心链路 + 引擎探测（导入/资源缺失都会失败）
          # 用 cmd 重定向兜底（onefile 引导进程 + 子进程结构）
          $env:STAMPTOOL_SELFTEST = "full"
          cmd /c "dist\StampTool.exe > %TEMP%\selftest.out 2> %TEMP%\selftest.err & echo EXIT:%ERRORLEVEL% > %TEMP%\selftest.code"
          $code = (Get-Content "$env:TEMP\selftest.code" -ErrorAction SilentlyContinue) -replace "EXIT:",""
          $lines = @(Get-Content "$env:TEMP\selftest.out","$env:TEMP\selftest.err" -ErrorAction SilentlyContinue)
          $lines | ForEach-Object { Write-Host $_ }
          "exit code: $code (output lines: $($lines.Count))"
          if ("$code" -ne "0") {
            if ($lines.Count -eq 0) {
              echo "::error::selftest produced NO output (exit $code) — crashed before printing"
            } else {
              $lines | Select-Object -Last 25 | ForEach-Object { echo "::error::selftest: $_" }
            }
            throw "selftest failed (exit $code)"
          }
          "selftest passed: full mode"
      - name: Real-launch visibility gate (fresh + corrupted state)
        timeout-minutes: 10
        shell: pwsh
        run: |
          # 用户报告：进程活着但主窗口不可见。此门禁在真实会话中
          # 启动 exe（无 selftest），断言主窗口句柄非零。
          # 注意：onefile 是「引导进程 + 子进程」结构，窗口属于子进程，
          # 必须扫描同名进程树，检查启动进程本身会永远拿到 0。
          function Assert-WindowVisible([string]$Scenario) {
            $launched = Start-Process -FilePath "dist\StampTool.exe" -PassThru
            $visible = $false
            $title = ""
            $deadline = (Get-Date).AddSeconds(25)
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
              $tree = Get-Process -Name StampTool -ErrorAction SilentlyContinue
              if (-not $tree) { break }   # 进程退出：同样视为不可见
              $owner = $tree | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object -First 1
              if ($owner) { $visible = $true; $title = $owner.MainWindowTitle; break }
            }
            if (-not $visible) {
              "--- $Scenario FAILED; startup log: ---"
              $logLines = Get-Content "$env:USERPROFILE\.stamp_tool\logs\stamp_tool.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
              $logLines | ForEach-Object { Write-Host $_ }
              # 关键诊断行同时输出为注解（公开 API 可读，便于排障）
              $logLines | Where-Object { $_ -match "窗口|可见|ERROR|CRITICAL|启动|WARNING" } | ForEach-Object {
                echo "::error::[$Scenario] $_"
              }
              echo "::error::[$Scenario] no visible window in StampTool process tree for 25s"
              throw "$Scenario : main window never became visible"
            }
            "$Scenario OK: window '$title' (pid $($owner.Id))"
            Stop-Process -Name StampTool -Force -ErrorAction SilentlyContinue
            Start-Sleep -Milliseconds 800
          }

          # 场景 1：全新环境
          Remove-Item -Recurse -Force "$env:USERPROFILE\.stamp_tool" -ErrorAction SilentlyContinue
          Assert-WindowVisible "fresh-profile"

          # 场景 2：旧版本残留的损坏印章库（不得挡住主窗口）
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.stamp_tool" | Out-Null
          Set-Content "$env:USERPROFILE\.stamp_tool\stamps.json" '["corrupt-entry", {"id": 123}, "junk"]'
          Assert-WindowVisible "corrupted-stamp-library"

          Remove-Item -Recurse -Force "$env:USERPROFILE\.stamp_tool" -ErrorAction SilentlyContinue
      - name: Package zip
        shell: pwsh
        run: |
          # Windows 分发习惯：单文件 exe 打包成 zip
          $zip = "dist\StampTool-$env:VERSION-windows-x64.zip"
          Compress-Archive -Path "dist\StampTool.exe" -DestinationPath $zip -Force
          "packaged: $zip"
      - uses: actions/upload-artifact@v4
        with:
          name: StampTool-windows-x64
          path: dist/StampTool-*-windows-x64.zip
          if-no-files-found: error

  build-macos:
    name: build macos app
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Determine version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
      - name: Build with PyInstaller
        run: pyinstaller -y StampTool.spec
      - name: Smoke-check app bundle (selftest)
        timeout-minutes: 10
        run: |
          BIN=dist/StampTool.app/Contents/MacOS/StampTool
          test -x "$BIN" || { echo "::error::app bundle not produced"; exit 1; }
          # 自检：窗口布局就绪 + 核心链路（渲染/盖章/导出）
          # 不用 timeout(1)：macOS runner 无 GNU coreutils
          STAMPTOOL_SELFTEST=full "$BIN" > selftest.log 2>&1 &
          PID=$!
          for _ in $(seq 1 120); do
            kill -0 "$PID" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$PID" 2>/dev/null; then
            kill -9 "$PID" 2>/dev/null
            echo "::error::selftest timed out after 120s"
            cat selftest.log
            exit 1
          fi
          wait "$PID"; CODE=$?
          cat selftest.log
          if [ "$CODE" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::selftest(exit=$CODE): $line"
            done < selftest.log
            exit 1
          fi
          ls -la dist/
      - name: Package dmg and zip
        run: |
          ARCH=$(uname -m)
          # macOS 分发习惯：dmg + Applications 快捷方式，拖拽安装
          STAGE=$(mktemp -d)
          cp -R dist/StampTool.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "StampTool $VERSION" -srcfolder "$STAGE" \
            -ov -format UDZO "dist/StampTool-${VERSION}-macos-${ARCH}.dmg"
          rm -rf "$STAGE"
          # 备用 zip（保权限位）
          ( cd dist && zip -qry "StampTool-${VERSION}-macos-${ARCH}.zip" StampTool.app )
          ls -la dist/*.dmg dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StampTool-macos
          path: |
            dist/StampTool-*-macos-*.dmg
            dist/StampTool-*-macos-*.zip
          if-no-files-found: error

  release:
    name: release (tag only)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List release assets
        run: ls -la artifacts/
      - name: Compose release body
        run: |
          {
            echo "# StampTool ${GITHUB_REF_NAME}"
            echo
            cat .github/release-notes.md
          } > release-body.md
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: release-body.md

