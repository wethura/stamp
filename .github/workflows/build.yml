name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          status=0
          python -m unittest discover -s tests -v 2>&1 | tee unittest.log || status=1
          if [ "$status" -ne 0 ]; then
            grep -E "^(FAIL|ERROR):" unittest.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

  build-windows:
    name: build windows exe
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build with PyInstaller
        run: pyinstaller -y StampTool-win.spec
      - name: Smoke-check exe
        shell: pwsh
        run: |
          if (-Not (Test-Path "dist/StampTool.exe")) { throw "StampTool.exe not produced" }
          "{0:N0} bytes" -f (Get-Item "dist/StampTool.exe").Length
          # 启动验证：打包/导入失败时进程会立即退出
          $proc = Start-Process -FilePath "dist\StampTool.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($proc.HasExited) { throw "exe exited immediately (code $($proc.ExitCode)) — likely a packaging/import failure" }
          "exe launched and stayed alive (pid $($proc.Id))"
          Stop-Process -Id $proc.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: StampTool-windows-x64
          path: dist/StampTool.exe
          if-no-files-found: error

  build-macos:
    name: build macos binary
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build with PyInstaller
        run: pyinstaller -y StampTool.spec
      - name: Smoke-check app bundle and package zip
        run: |
          BIN=dist/StampTool.app/Contents/MacOS/StampTool
          test -x "$BIN" || { echo "app bundle not produced"; ls -la dist/; exit 1; }
          ls -la dist/
          # 启动验证：初始化成功的 GUI 进程不会立即退出
          "$BIN" & APP_PID=$!
          sleep 8
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "app launched and stayed alive (pid $APP_PID)"
            kill "$APP_PID" 2>/dev/null || true
          else
            echo "app exited immediately — likely a packaging/import failure"
            exit 1
          fi
          # 保留 .app 形态（可双击、带图标），zip 保权限位
          cd dist && zip -qry StampTool-macos.zip StampTool.app
      - uses: actions/upload-artifact@v4
        with:
          name: StampTool-macos
          path: dist/StampTool-macos.zip
          if-no-files-found: error

  release:
    name: release (tag only)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
